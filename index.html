<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira Tech - AI Auto Grader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --text-main: #f8fafc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #1e1b4b);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0; padding: 2rem;
            display: flex; justify-content: center;
        }
        .container {
            max-width: 1000px; width: 100%;
            display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 2rem;
        }
        h1 { grid-column: 1 / -1; text-align: center; color: #60a5fa; }
        input, textarea {
            width: 100%; padding: 0.75rem; margin-bottom: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; border-radius: 8px; box-sizing: border-box;
        }
        button {
            width: 100%; background: var(--primary); color: white;
            padding: 1rem; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
        .results { display: none; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🏫 Instructor Review Dashboard</h1>
        <div class="glass-panel">
            <h2>📝 Submit Assignment</h2>
            <label>Submission ID</label><input type="text" id="sub_id" value="student_001">
            <label>Question</label><textarea id="q_text" rows="2">What is Supervised Learning?</textarea>
            <label>Answer</label><textarea id="ans_text" rows="3">Supervised learning uses labeled data.</textarea>
            <label>Rubric</label><textarea id="r_text" rows="2">10 marks. Needs definition.</textarea>
            <button id="eval-btn" onclick="evaluateAnswer()">Evaluate Answer</button>
        </div>
        <div class="glass-panel">
            <h2>📊 Results</h2>
            <div id="results" class="results">
                <h3>Score: <span id="score" style="color:#10b981"></span></h3>
                <h3>Copied: <span id="copied" style="color:#f59e0b"></span></h3>
                <p><b>Feedback:</b> <span id="feedback"></span></p>
            </div>
        </div>
    </div>
    <script>
        async function evaluateAnswer() {
            document.getElementById('eval-btn').innerText = "Evaluating...";
            const payload = {
                submission_id: document.getElementById('sub_id').value,
                question_id: "q1", rubric_id: "r1",
                question_text: document.getElementById('q_text').value,
                answer_text: document.getElementById('ans_text').value,
                rubric_text: document.getElementById('r_text').value
            };
            try {
                // Pointing to your Vercel Backend
                const response = await fetch('/api/v1/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                document.getElementById('score').innerText = data.score + " / " + data.max_score;
                document.getElementById('copied').innerText = data.duplicate_flag ? "⚠️ YES" : "✅ NO";
                document.getElementById('feedback').innerText = data.feedback;
                document.getElementById('results').style.display = 'block';
            } catch (e) {
                alert("Error connecting to AI Backend.");
            }
            document.getElementById('eval-btn').innerText = "Evaluate Answer";
        }
    </script>
</body>
</html>
